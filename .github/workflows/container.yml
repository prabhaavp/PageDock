name: Container image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '18 8 * * 1'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: pagedock-test:local
          cache-from: type=gha
      - name: Run focused tests
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" \
            -e APP_PASSWORD=test-password-long \
            -e SESSION_SECRET=test-secret-long-enough-for-sessions \
            -e PRINTER_HOST=127.0.0.1 \
            --entrypoint python pagedock-test:local -m unittest discover -s tests -q
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
